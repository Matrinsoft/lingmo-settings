[workspace]
members = ["cosmic-settings", "page", "pages/*", "subscriptions/*"]
default-members = ["cosmic-settings"]
resolver = "3"

[workspace.package]
rust-version = "1.93"

[workspace.dependencies]
cosmic-randr = { git = "https://github.com/Matrinsoft/lingmo-randr" }
tokio = { version = "1.53.1", features = ["macros"] }
iced_winit = { git = "https://github.com/Matrinsoft/liblingmo", default-features = false }
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "rayon",
    "webp",
    "hdr",
] }

[workspace.dependencies.libcosmic]
features = [
    "dbus-config",
    "desktop",
    "multi-window",
    "winit",
    "tokio",
    "qr_code",
]
git = "https://github.com/Matrinsoft/liblingmo"

[workspace.dependencies.cosmic-config]
git = "https://github.com/Matrinsoft/liblingmo"

[workspace.dependencies.cosmic-bg-config]
git = "https://github.com/Matrinsoft/lingmo-background"

[workspace.dependencies.cosmic-comp-config]
git = "https://github.com/Matrinsoft/lingmo-comp"
features = ["output"]

[workspace.dependencies.cosmic-idle-config]
git = "https://github.com/Matrinsoft/lingmo-idle"

[workspace.dependencies.cosmic-panel-config]
git = "https://github.com/Matrinsoft/lingmo-panel"

[workspace.dependencies.cosmic-randr-shell]
git = "https://github.com/Matrinsoft/lingmo-randr"

[workspace.dependencies.sctk]
version = "0.20"
package = "smithay-client-toolkit"

[profile.dev]
opt-level = 3
lto = "off"

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"

[profile.release-with-debug]
inherits = "release"
lto = "off"
debug = true

# [patch.'https://github.com/Matrinsoft/lingmo-text']
# cosmic-text = { git = "https://github.com/Matrinsoft/lingmo-text//", rev = "b017d7c" }

[patch.'https://github.com/Matrinsoft/lingmo-protocols']
cosmic-protocols = { git = "https://github.com/Matrinsoft/lingmo-protocols//", rev = "e95d895" }
cosmic-client-toolkit = { git = "https://github.com/Matrinsoft/lingmo-protocols//", rev = "e95d895" }

